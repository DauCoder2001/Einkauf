<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Einkauf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#cc071e">
<title>Einkauf</title>
<style>
  :root {
    --bg: #f4f4f2;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --line: #e2e2e0;
    --accent: #cc071e;
    --accent-soft: #fde8ea;
    --ok: #1f8a4c;
    --chip: #f0f0ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --card: #1c1c1f;
      --text: #f2f2f4;
      --muted: #9a9aa0;
      --line: #2e2e33;
      --accent: #ff4d5e;
      --accent-soft: #3a1a1e;
      --ok: #4cc47e;
      --chip: #2a2a2e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .tabs button {
    flex: 1; border: 0; background: none; color: var(--text);
    font: inherit; font-weight: 600; padding: 8px; border-radius: 8px;
  }
  .tabs .count[hidden] { display: none; }
  .tabs button.active { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .tabs .count {
    display: inline-block; min-width: 22px; padding: 0 6px; margin-left: 4px;
    border-radius: 11px; background: var(--accent); color: #fff; font-size: 13px; line-height: 22px;
  }
  main { padding: 12px 16px; max-width: 640px; margin: 0 auto; }
  section.cat {
    background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px;
  }
  .cat h2 {
    margin: 0 0 10px; font-size: 15px; font-weight: 700; color: var(--muted);
    display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: .03em;
  }
  .cat h2 .num {
    display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 13px; letter-spacing: 0;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1.5px solid transparent; background: var(--chip); color: var(--text);
    font: inherit; font-size: 16px; padding: 8px 14px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip.add { background: none; border: 1.5px dashed var(--line); color: var(--muted); }
  .chip .x { font-weight: 700; color: var(--accent); margin-left: 2px; }
  .editing .chip:not(.add) { animation: wiggle .3s ease-in-out infinite alternate; }
  @keyframes wiggle { from { transform: rotate(-1deg); } to { transform: rotate(1deg); } }

  ul.shop { list-style: none; margin: 0; padding: 0; }
  ul.shop li {
    display: flex; align-items: center; gap: 12px; padding: 11px 0;
    border-top: 1px solid var(--line); font-size: 18px; cursor: pointer; user-select: none;
  }
  ul.shop li:first-child { border-top: 0; padding-top: 2px; }
  .box {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--muted); display: grid; place-items: center;
  }
  li.done { color: var(--muted); text-decoration: line-through; }
  li.done .box { background: var(--ok); border-color: var(--ok); }
  li.done .box::after { content: "✓"; color: #fff; font-size: 15px; font-weight: 700; }
  section.cat.complete { opacity: .5; }

  ul.todo li { cursor: default; align-items: flex-start; }
  ul.todo .box { cursor: pointer; margin-top: 1px; }
  ul.todo .txt { flex: 1; cursor: pointer; }
  ul.todo .meta { display: block; font-size: 14px; color: var(--muted); text-decoration: none; }
  ul.todo .meta.late { color: var(--accent); font-weight: 600; }
  ul.todo .meta.soon { color: var(--text); font-weight: 600; }
  ul.todo .edit {
    flex: none; border: 0; background: var(--chip); color: var(--muted);
    width: 36px; height: 36px; border-radius: 50%; margin: -5px 0 -5px 4px;
    display: grid; place-items: center; text-decoration: none;
  }
  ul.todo .edit svg { width: 18px; height: 18px; }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .progress { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin: 2px 0 14px; }
  .progress div { height: 100%; background: var(--ok); transition: width .2s; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--bg); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; justify-content: center;
  }
  footer button {
    flex: 1; max-width: 300px; border: 0; border-radius: 12px; padding: 13px;
    font: inherit; font-weight: 600; background: var(--chip); color: var(--text);
  }
  footer button.primary { background: var(--accent); color: #fff; }
  footer button:disabled { opacity: .4; }

  footer button.lock { flex: none; width: 56px; display: grid; place-items: center; padding: 0; }
  footer button.lock svg { width: 24px; height: 24px; }
  footer button.lock.on { background: var(--text); color: var(--bg); }
  .lockbar {
    display: flex; align-items: center; gap: 8px; margin: 0 0 12px; padding: 10px 14px;
    border-radius: 12px; background: var(--text); color: var(--bg); font-size: 15px; font-weight: 600;
  }
  .lockbar svg { width: 18px; height: 18px; flex: none; }
  .locked ul.shop li { cursor: default; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .overlay {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .overlay[hidden] { display: none; }
  .sheet {
    background: var(--card); width: 100%; max-width: 640px; border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
    max-height: 92vh; overflow-y: auto;
  }
  .sheet h3 { margin: 0 0 6px; font-size: 19px; }
  .sheet p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
  #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 220px; }
  #reader video { display: block; width: 100% !important; }
  .sheet input {
    width: 100%; font: inherit; padding: 11px 12px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--bg); color: var(--text); margin-bottom: 14px;
  }
  .sheet label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .sheet .chips { margin-bottom: 16px; }
  .sheet .row { display: flex; gap: 10px; }
  .sheet .row button {
    flex: 1; border: 0; border-radius: 12px; padding: 13px;
    font: inherit; font-weight: 600; background: var(--chip); color: var(--text);
  }
  .sheet .row button.primary { background: var(--accent); color: #fff; }
  .sheet .row button:disabled { opacity: .4; }
</style>
</head>
<body>
<header>
  <div class="tabs">
    <button id="tabPlan" class="active">Planen</button>
    <button id="tabShop">Einkaufen <span class="count" id="count" hidden></span></button>
    <button id="tabTodo">Aufgaben <span class="count" id="todoCount" hidden></span></button>
  </div>
</header>
<main id="main"></main>
<footer id="footer"></footer>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet"></div></div>

<script>
const KEY = "einkauf-rewe-v1";

// Reihenfolge im Laden – hier Kategorien und Startartikel anpassen
const DEFAULT = [
  ["Brötchen", ["Brötchen", "Körnerbrötchen"]],
  ["Obst & Gemüse", ["Äpfel", "Bananen", "Tomaten", "Gurke", "Salat", "Kartoffeln", "Zwiebeln"]],
  ["Toastbrot & Kühlregal", ["Toastbrot", "Butter", "Joghurt", "Kräuterquark", "Milch"]],
  ["Frühstück & Kaffee", ["Eier", "Kaffee", "Kaffeemilch", "Kaffeefilter", "Marmelade"]],
  ["Fleischtheke", ["Beinscheibe", "Aufschnitt"]],
  ["Käse", ["Gouda", "Frischkäse"]],
  ["Konserven & Teigwaren", ["Nudeln", "Reis", "Dosentomaten", "Suppe"]],
  ["Haushalt", ["Spülmittel", "Küchenrolle", "Toilettenpapier", "Müllbeutel"]],
  ["Hygiene & Nahrungsergänzung", ["Zahnpasta", "Duschgel", "Taschentücher", "Vitamine"]],
  ["Tiefkühl", ["Gemüse TK", "Fisch TK"]],
];

let uid = Date.now();
const newId = () => (uid++).toString(36);

function fresh() {
  return {
    cats: DEFAULT.map(([name, items]) => ({
      id: newId(), name,
      items: items.map(n => ({ id: newId(), name: n, need: false, done: false })),
    })),
    todos: [],
  };
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.cats)) {
      if (!Array.isArray(s.todos)) s.todos = [];
      return s;
    }
  } catch (e) {}
  return fresh();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

let state = load();
let view = "plan";
let editing = false;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const needed = () => state.cats.flatMap(c => c.items.filter(i => i.need));

function findItem(id) {
  for (const c of state.cats) {
    const i = c.items.find(i => i.id === id);
    if (i) return [c, i];
  }
  return [];
}

function render() {
  $("tabPlan").classList.toggle("active", view === "plan");
  $("tabShop").classList.toggle("active", view === "shop");
  $("tabTodo").classList.toggle("active", view === "todo");
  const n = needed().filter(i => !i.done).length;
  $("count").hidden = n === 0;
  $("count").textContent = n;
  const t = todosDue();
  $("todoCount").hidden = t === 0;
  $("todoCount").textContent = t;
  if (view === "plan") renderPlan();
  else if (view === "shop") renderShop();
  else renderTodo();
}

function renderPlan() {
  let html = `<p class="hint">${editing
    ? "Tippe auf einen Artikel, um ihn zu löschen."
    : "Tippe an, was gebraucht wird. „+“ fügt neue Artikel hinzu."}</p>`;
  html += `<div class="${editing ? "editing" : ""}">`;
  state.cats.forEach((c, idx) => {
    html += `<section class="cat"><h2><span class="num">${idx + 1}</span>${esc(c.name)}</h2><div class="chips">`;
    for (const i of c.items) {
      html += `<button class="chip ${i.need ? "on" : ""}" data-item="${i.id}">${esc(i.name)}${editing ? '<span class="x">×</span>' : ""}</button>`;
    }
    if (!editing) html += `<button class="chip add" data-add="${c.id}">+</button>`;
    html += `</div></section>`;
  });
  html += `</div>`;
  $("main").innerHTML = html;

  const any = needed().length > 0;
  $("footer").innerHTML = editing
    ? `<button id="btnEdit" class="primary">Fertig</button>`
    : `<button id="btnEdit">Bearbeiten</button>
       <button id="btnScan" class="primary">Scannen</button>
       <button id="btnClear" ${any ? "" : "disabled"}>Abwählen</button>`;
}

const ICON_LOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
const ICON_UNLOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>`;

function renderShop() {
  const list = needed();
  const locked = !!state.locked;
  if (!list.length) {
    $("main").innerHTML = `<div class="empty">Noch nichts ausgewählt.<br>Wechsle zu <b>Planen</b> und tippe die benötigten Sachen an.</div>`;
    $("footer").innerHTML = "";
    return;
  }
  const done = list.filter(i => i.done).length;
  let html = `<div class="progress"><div style="width:${(done / list.length) * 100}%"></div></div>`;
  if (locked) html += `<div class="lockbar" id="lockbar">${ICON_LOCK}Gesperrt – zum Abhaken unten entsperren</div>`;
  html += `<div class="${locked ? "locked" : ""}">`;
  state.cats.forEach((c, idx) => {
    const items = c.items.filter(i => i.need);
    if (!items.length) return;
    const complete = items.every(i => i.done);
    html += `<section class="cat ${complete ? "complete" : ""}"><h2><span class="num">${idx + 1}</span>${esc(c.name)}</h2><ul class="shop">`;
    for (const i of items) {
      html += `<li class="${i.done ? "done" : ""}" data-check="${i.id}"><span class="box"></span>${esc(i.name)}</li>`;
    }
    html += `</ul></section>`;
  });
  html += `</div>`;
  $("main").innerHTML = html;
  $("footer").innerHTML =
    `<button id="btnLock" class="lock ${locked ? "on" : ""}" aria-label="${locked ? "Entsperren" : "Sperren"}">${locked ? ICON_LOCK : ICON_UNLOCK}</button>
     <button id="btnShare">Teilen</button>
     <button id="btnFinish" class="primary" ${done && !locked ? "" : "disabled"}>Abschließen</button>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, li");
  if (!t) return;

  if (t.id === "tabPlan") { view = "plan"; editing = false; }
  else if (t.id === "tabShop") { view = "shop"; editing = false; }
  else if (t.id === "tabTodo") { view = "todo"; editing = false; }
  else if (t.id === "btnTodoAdd") { editTodo(null); return; }
  else if (t.id === "btnTodoClean") {
    if (!confirm("Erledigte Aufgaben endgültig entfernen?")) return;
    state.todos = state.todos.filter(x => !x.done);
  }
  else if (e.target.closest("[data-todo-check]")) {
    const x = state.todos.find(x => x.id === e.target.closest("[data-todo-check]").dataset.todoCheck);
    if (!x) return;
    completeTodo(x);
  }
  else if (e.target.closest("[data-todo-edit]")) {
    editTodo(state.todos.find(x => x.id === e.target.closest("[data-todo-edit]").dataset.todoEdit));
    return;
  }
  else if (t.id === "btnEdit") { editing = !editing; }
  else if (t.id === "btnClear") {
    if (!confirm("Alle Artikel abwählen?")) return;
    needed().forEach(i => { i.need = false; i.done = false; });
  }
  else if (t.id === "btnFinish") {
    const open = needed().filter(i => !i.done).length;
    const msg = open
      ? `Eingekaufte Artikel von der Liste nehmen? ${open} nicht abgehakte Artikel bleiben stehen.`
      : "Einkauf abschließen und Liste leeren?";
    if (!confirm(msg)) return;
    needed().forEach(i => { if (i.done) { i.need = false; i.done = false; } });
    if (!needed().length) view = "plan";
  }
  else if (t.id === "btnShare") { share(); return; }
  else if (t.id === "btnScan") { startScan(); return; }
  else if (t.closest("#overlay")) return;
  else if (t.dataset.item) {
    const [c, i] = findItem(t.dataset.item);
    if (!i) return;
    if (editing) {
      if (!confirm(`„${i.name}“ dauerhaft löschen?`)) return;
      c.items = c.items.filter(x => x !== i);
    } else {
      i.need = !i.need;
      i.done = false;
    }
  }
  else if (t.dataset.add) {
    const c = state.cats.find(c => c.id === t.dataset.add);
    const name = (prompt(`Neuer Artikel für „${c.name}“:`) || "").trim();
    if (!name) return;
    c.items.push({ id: newId(), name, need: true, done: false });
  }
  else if (t.id === "btnLock") { state.locked = !state.locked; }
  else if (t.dataset.check) {
    if (state.locked) {
      const bar = $("lockbar");
      bar.classList.remove("shake");
      void bar.offsetWidth;
      bar.classList.add("shake");
      return;
    }
    const [, i] = findItem(t.dataset.check);
    if (!i) return;
    i.done = !i.done;
  }
  else return;

  save();
  render();
  if (t.id.startsWith("tab")) scrollTo(0, 0);
});

async function share() {
  const text = state.cats
    .map(c => [c.name, c.items.filter(i => i.need && !i.done)])
    .filter(([, items]) => items.length)
    .map(([name, items]) => `${name}:\n` + items.map(i => `– ${i.name}`).join("\n"))
    .join("\n\n");
  if (!text) { alert("Alles erledigt – nichts mehr zu teilen."); return; }
  try {
    if (navigator.share) await navigator.share({ title: "Einkaufsliste", text });
    else { await navigator.clipboard.writeText(text); alert("Liste in die Zwischenablage kopiert."); }
  } catch (e) {}
}

// ---- Aufgaben ----
const REPEATS = [["", "Einmalig"], ["7d", "Wöchentlich"], ["14d", "Alle 2 Wochen"], ["1m", "Monatlich"],
                 ["3m", "Vierteljährlich"], ["6m", "Halbjährlich"], ["12m", "Jährlich"]];
const repeatLabel = r => (REPEATS.find(x => x[0] === r) || REPEATS[0])[1];

const pad = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => isoDate(new Date());
const daysUntil = s => Math.round((parseDate(s) - parseDate(today())) / 864e5);

function addRepeat(s, r) {
  const d = parseDate(s);
  const n = parseInt(r, 10);
  if (r.endsWith("d")) d.setDate(d.getDate() + n);
  else {
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
  }
  return isoDate(d);
}

const todosDue = () => state.todos.filter(x => !x.done && x.due && daysUntil(x.due) <= 0).length;

function dueText(x) {
  if (!x.due) return ["", ""];
  const n = daysUntil(x.due);
  const date = parseDate(x.due).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
  if (n < 0) return [`Überfällig seit ${-n} ${-n === 1 ? "Tag" : "Tagen"} (${date})`, "late"];
  if (n === 0) return ["Heute fällig", "late"];
  if (n === 1) return ["Morgen fällig", "soon"];
  if (n <= 7) return [`In ${n} Tagen (${date})`, "soon"];
  return [date, ""];
}

function completeTodo(x) {
  if (x.done) { x.done = false; return; }
  if (x.repeat) {
    x.due = addRepeat(x.due || today(), x.repeat);
  } else {
    x.done = true;
  }
}

function renderTodo() {
  const open = state.todos.filter(x => !x.done).sort((a, b) =>
    (a.due || "9999") < (b.due || "9999") ? -1 : (a.due || "9999") > (b.due || "9999") ? 1 : 0);
  const done = state.todos.filter(x => x.done);

  const item = x => {
    const [txt, cls] = dueText(x);
    const meta = [txt, x.repeat ? "↻ " + repeatLabel(x.repeat) : ""].filter(Boolean).join(" · ");
    return `<li class="${x.done ? "done" : ""}">
      <span class="box" data-todo-check="${x.id}"></span>
      <span class="txt" data-todo-edit="${x.id}">${esc(x.text)}${meta && !x.done ? `<span class="meta ${cls}">${meta}</span>` : ""}</span>
      <button class="edit" data-todo-edit="${x.id}" aria-label="Bearbeiten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </li>`;
  };

  let html = "";
  if (!state.todos.length) {
    html = `<div class="empty">Noch keine Aufgaben.<br>Tippe auf <b>Neue Aufgabe</b>, z. B. „Jalousie erneuern“ oder „Beratungstermin Pflegekasse“ (halbjährlich).</div>`;
  } else {
    html += `<p class="hint">Kreis antippen = erledigt (nochmal antippen = zurückholen). Stift = bearbeiten. Wiederkehrende Aufgaben springen beim Abhaken auf den nächsten Termin.</p>`;
    if (open.length) html += `<section class="cat"><ul class="shop todo">${open.map(item).join("")}</ul></section>`;
    if (done.length) html += `<section class="cat complete"><h2>Erledigt</h2><ul class="shop todo">${done.map(item).join("")}</ul></section>`;
  }
  $("main").innerHTML = html;
  $("footer").innerHTML =
    (done.length ? `<button id="btnTodoClean">Aufräumen</button>` : "") +
    `<button id="btnTodoAdd" class="primary">Neue Aufgabe</button>`;
}

function editTodo(x) {
  let repeat = x ? x.repeat || "" : "";
  openSheet(`<h3>${x ? "Aufgabe bearbeiten" : "Neue Aufgabe"}</h3>
    <label for="todoText">Was ist zu tun?</label>
    <input id="todoText" value="${x ? esc(x.text) : ""}" placeholder="z. B. Jalousie erneuern" autocomplete="off">
    <label for="todoDue">Fällig am (optional)</label>
    <input id="todoDue" type="date" value="${x ? x.due || "" : ""}">
    <label>Wiederholen</label>
    <div class="chips" id="repeatChoice">${REPEATS.map(([v, l]) =>
      `<button class="chip ${v === repeat ? "on" : ""}" data-repeat="${v}">${l}</button>`).join("")}</div>
    <div class="row">
      ${x ? `<button id="todoDel">Löschen</button>` : `<button id="todoCancel">Abbrechen</button>`}
      <button id="todoSave" class="primary">Speichern</button>
    </div>`);

  $("repeatChoice").onclick = e => {
    const b = e.target.closest("[data-repeat]");
    if (!b) return;
    repeat = b.dataset.repeat;
    $("repeatChoice").querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
  };
  if ($("todoCancel")) $("todoCancel").onclick = closeSheet;
  if ($("todoDel")) $("todoDel").onclick = () => {
    if (!confirm(`„${x.text}“ löschen?`)) return;
    state.todos = state.todos.filter(t => t !== x);
    save(); render(); closeSheet();
  };
  $("todoSave").onclick = () => {
    const text = $("todoText").value.trim();
    if (!text) { $("todoText").focus(); return; }
    let due = $("todoDue").value;
    if (repeat && !due) due = today();
    if (x) Object.assign(x, { text, due, repeat });
    else state.todos.push({ id: newId(), text, due, repeat, done: false });
    save(); render(); closeSheet();
  };
  if (!x) $("todoText").focus();
}

// ---- Barcode-Scanner ----
const SCANNER_URL = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
let scanner = null;

function loadScript(src) {
  return new Promise((ok, fail) => {
    if (window.Html5Qrcode) return ok();
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}

function openSheet(html) {
  $("sheet").innerHTML = html;
  $("overlay").hidden = false;
}
async function closeSheet() {
  $("overlay").hidden = true;
  await stopScanner();
  if ($("overlay").hidden) $("sheet").innerHTML = "";
}
async function stopScanner() {
  if (!scanner) return;
  const s = scanner;
  scanner = null;
  try { await s.stop(); } catch (e) {}
  try { s.clear(); } catch (e) {}
}

async function startScan() {
  openSheet(`<h3>Barcode scannen</h3>
    <p>Halte die Kamera auf den Strichcode der Verpackung.</p>
    <div id="reader"></div>
    <div class="row" style="margin-top:14px"><button id="scanCancel">Abbrechen</button></div>`);
  $("scanCancel").onclick = closeSheet;
  try {
    await loadScript(SCANNER_URL);
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode("reader", {
      verbose: false,
      formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    });
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: (w, h) => ({ width: Math.min(w * 0.85, 320), height: Math.min(h * 0.45, 140) }) },
      code => { if (!scanner) return; stopScanner(); onCode(code); },
      () => {}
    );
  } catch (e) {
    scanner = null;
    $("reader").outerHTML = `<p>Die Kamera konnte nicht gestartet werden. Bitte den Kamerazugriff erlauben und es erneut versuchen.</p>`;
  }
}

async function onCode(code) {
  // Schon bekannt? Dann nur auf die Liste setzen.
  for (const c of state.cats) {
    const i = c.items.find(i => i.code === code);
    if (i) {
      i.need = true; i.done = false;
      save(); render();
      openSheet(`<h3>${esc(i.name)}</h3><p>Steht jetzt auf der Liste (${esc(c.name)}).</p>
        <div class="row"><button id="again">Weiter scannen</button><button id="ok" class="primary">Fertig</button></div>`);
      $("again").onclick = startScan;
      $("ok").onclick = closeSheet;
      return;
    }
  }

  openSheet(`<h3>Produkt wird gesucht …</h3><p>Barcode ${esc(code)}</p>`);
  let name = "";
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name_de,product_name,brands`);
    const d = await r.json();
    const p = d.product || {};
    name = (p.product_name_de || p.product_name || (p.brands || "").split(",")[0] || "").trim();
  } catch (e) {}
  askDetails(code, name);
}

function askDetails(code, name) {
  let catId = null;
  openSheet(`<h3>${name ? "Produkt gefunden" : "Produkt nicht gefunden"}</h3>
    <p>${name ? "Name bei Bedarf anpassen und Bereich wählen." : "Bitte Namen eingeben und Bereich wählen."}</p>
    <label for="newName">Name</label>
    <input id="newName" value="${esc(name)}" placeholder="z. B. Joghurt mild" autocomplete="off">
    <label>Bereich im Laden</label>
    <div class="chips" id="catChoice">${state.cats.map((c, idx) =>
      `<button class="chip" data-cat="${c.id}">${idx + 1}. ${esc(c.name)}</button>`).join("")}</div>
    <div class="row"><button id="cancel">Abbrechen</button><button id="add" class="primary" disabled>Hinzufügen</button></div>`);

  const check = () => { $("add").disabled = !catId || !$("newName").value.trim(); };
  $("newName").oninput = check;
  $("catChoice").onclick = e => {
    const b = e.target.closest("[data-cat]");
    if (!b) return;
    catId = b.dataset.cat;
    $("catChoice").querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
    check();
  };
  $("cancel").onclick = closeSheet;
  $("add").onclick = () => {
    const c = state.cats.find(c => c.id === catId);
    c.items.push({ id: newId(), name: $("newName").value.trim(), code, need: true, done: false });
    save(); render();
    closeSheet();
  };
  if (!name) $("newName").focus();
}

render();
</script>
